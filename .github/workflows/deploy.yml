name: Build & Deploy

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json
          coverage: none

      - name: Install Dependencies
        working-directory: ./server
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment
        working-directory: ./server
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Tests
        working-directory: ./server
        env:
          STRIPE_SECRET_KEY: sk_test_dummy
        run: ./vendor/bin/phpunit --testsuite Unit

  build-client:
    name: Build React Client
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push stripe-client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stripe-client:latest
            ${{ secrets.DOCKER_USERNAME }}/stripe-client:${{ github.sha }}
          build-args: |
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  build-api:
    name: Build Laravel API
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push stripe-api
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stripe-api:latest
            ${{ secrets.DOCKER_USERNAME }}/stripe-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-latest
    needs: [build-client, build-api]
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DIRECTORY }}
            docker compose pull stripe-client stripe-api
            docker compose up -d stripe-client stripe-api
            docker image prune -f
